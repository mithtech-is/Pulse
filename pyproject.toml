[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "Enterprise Project Management Platform"
authors = [
    {name = "MithTech", email = "info@mith.tech"},
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[tool.bench]
app_type = "frappe"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
